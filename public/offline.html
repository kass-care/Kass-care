<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2e33">
<title>No connection | KASSCare</title>
<link rel="stylesheet" href="/css/kasscare-theme.css">
</head>
<body class="kc-body">
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div style="max-width:420px;text-align:center">
    <img src="/icons/kasscare-192.png" width="72" height="72" alt="" style="border-radius:18px">
    <h1 style="font-family:var(--kc-font-display);color:var(--kc-ink);font-size:28px;margin:20px 0 8px">You're offline</h1>
    <p style="color:var(--kc-muted);margin:0 0 24px">KASSCare needs a connection to load patient information. Try again when you have signal.</p>
    <button class="kc-btn kc-btn--primary" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
